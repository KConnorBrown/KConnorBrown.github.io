[project]
name = "connorbrown-net"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0,<6.0",
    "gunicorn>=21.2",
    "whitenoise>=6.6",
    "psycopg[binary]>=3.1",
    "dj-database-url>=2.1",
    "markdown>=3.5",
    "django-storages>=1.14",
    "boto3>=1.34",
    "Pillow>=10.0",
]

[tool.vercel]
entrypoint = "config.wsgi:application"
