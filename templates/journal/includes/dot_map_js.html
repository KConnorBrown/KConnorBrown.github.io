<script>
  (() => {
    const map = document.getElementById("photo-stream");
    if (!map || !map.classList.contains("dot-map")) return;

    let items = [];
    let discs = [];
    let images = [];
    let labels = [];
    let gridMeta = [];

    const pageBtn = document.getElementById("page-indicator");
    const pageModal = document.getElementById("page-info-modal");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const motion = window.MapMotion || null;

    function isTouchMode() {
      return Boolean(
        (motion && motion.isTouch()) || document.body.classList.contains("map-touch")
      );
    }

    function refreshItems() {
      items = Array.from(map.querySelectorAll(".dot-item:not(.is-filter-hidden)"));
      discs = items.map((item) => item.querySelector(".dot-disc"));
      images = discs.map((disc) => (disc ? disc.querySelector("img") : null));
      labels = discs.map((disc) => (disc ? disc.querySelector(".dot-label") : null));
      const cols = Math.max(1, parseInt(map.dataset.navCount || "7", 10));
      gridMeta = items.map((item, i) => {
        const col = i % cols;
        const row = Math.floor(i / cols);
        return {
          col,
          row,
          isNav: item.classList.contains("dot-nav") || item.classList.contains("dot-page"),
        };
      });
    }

    refreshItems();
    if (!items.length) return;

    // Smooth fisheye warp with no lens boundary. Space is remapped radially:
    //   R(r) = r * (1 + B * g),  g = exp(-r^2 / (2 * sigma^2))
    const BULGE = 1.4;
    const SIGMA_CELLS = 2.0;
    const MIN_SCALE = 0.32;
    const MAX_CELL = 150;

    let cellSize = 0;
    let centers = [];
    let mouseX = null;
    let mouseY = null;
    let frameQueued = false;
    let shimmerRaf = 0;
    let shimmerT0 = 0;

    function layoutColumns() {
      const section = map.closest(".photo-stream-section");
      const available =
        (section && section.clientWidth) ||
        (map.parentElement && map.parentElement.clientWidth) ||
        map.clientWidth ||
        window.innerWidth;
      if (!available) return;
      const navCount = Math.max(1, parseInt(map.dataset.navCount || "8", 10));
      const cols = navCount;
      const touch = isTouchMode();
      const hasFilterRail = Boolean(document.querySelector(".corner-filter-rail"));
      const leftGutter = touch ? (hasFilterRail ? 112 : 92) : 48;
      const rightGutter = touch ? 92 : 48;
      const usable = Math.max(available - leftGutter - rightGutter, 160);
      cellSize = Math.min(usable / cols, MAX_CELL);
      map.style.width = `${Math.round(cols * cellSize)}px`;
      map.style.maxWidth = `${Math.round(cols * cellSize)}px`;
      map.style.paddingLeft = "";
      map.style.paddingRight = "";
      map.style.marginLeft = "auto";
      map.style.marginRight = "auto";
      map.style.setProperty("--dot-cols", String(cols));
      map.style.setProperty("--dot-cell", `${cellSize}px`);
      refreshItems();
    }

    function measureCenters() {
      centers = items.map((item) => {
        const rect = item.getBoundingClientRect();
        return {
          x: rect.left + window.scrollX + rect.width / 2,
          y: rect.top + window.scrollY + rect.height / 2,
        };
      });
    }

    function gravityOffset() {
      if (!motion) return { x: 0, y: 0 };
      return motion.gravity();
    }

    function clearInlineReveal() {
      items.forEach((item, i) => {
        if (images[i]) images[i].style.opacity = "";
        if (labels[i]) labels[i].style.opacity = "";
      });
    }

    function resetAll() {
      map.classList.add("is-resting");
      const g = gravityOffset();
      const useGravity = isTouchMode() && !reduceMotion && (g.x || g.y);
      items.forEach((item, i) => {
        const disc = discs[i];
        if (!disc) return;
        if (useGravity) {
          disc.style.transform = `translate(${g.x.toFixed(2)}px, ${g.y.toFixed(2)}px)`;
        } else {
          disc.style.transform = "";
        }
        item.style.zIndex = "";
        if (!isTouchMode()) {
          if (images[i]) images[i].style.opacity = "";
          if (labels[i]) labels[i].style.opacity = "";
        }
      });
      if (isTouchMode()) {
        // Leave shimmer to own its opacity; clear only when shimmer stopped.
      }
    }

    function contentReveal(dist) {
      return Math.min(Math.max((1 - dist / cellSize) / 0.5, 0), 1);
    }

    function lensSuppressed() {
      return (
        document.body.classList.contains("social-lens-active") ||
        document.body.classList.contains("filter-motion-active") ||
        document.body.classList.contains("home-intro-active")
      );
    }

    function applyLens() {
      frameQueued = false;
      if (isTouchMode()) {
        applyTouchTransforms();
        return;
      }
      if (mouseX === null) return;
      if (lensSuppressed()) {
        resetAll();
        return;
      }

      const sigma = cellSize * SIGMA_CELLS;
      const twoSigmaSq = 2 * sigma * sigma;
      const B = BULGE;

      for (let i = 0; i < items.length; i += 1) {
        const disc = discs[i];
        if (!disc) continue;
        const dx = centers[i].x - mouseX;
        const dy = centers[i].y - mouseY;
        const distSq = dx * dx + dy * dy;
        const g = Math.exp(-distSq / twoSigmaSq);
        const dist = Math.sqrt(distSq);
        const safeDist = dist || 1;
        const shift = B * dist * g;
        const tangential = 1 + B * g;
        const radial = 1 + B * g * (1 - distSq / (sigma * sigma));
        const scale = Math.max(Math.min(tangential, radial), MIN_SCALE);
        const offsetX = (dx / safeDist) * shift;
        const offsetY = (dy / safeDist) * shift;
        const reveal = contentReveal(dist);

        disc.style.transform = `translate(${offsetX.toFixed(2)}px, ${offsetY.toFixed(2)}px) scale(${scale.toFixed(3)})`;
        items[i].style.zIndex = String(1 + Math.round(scale * 100));
        if (images[i] && items[i].classList.contains("dot-photo")) {
          images[i].style.opacity = reveal.toFixed(3);
        }
        if (labels[i]) {
          labels[i].style.opacity = reveal.toFixed(3);
        }
      }
    }

    function applyTouchTransforms(waveOpacity) {
      const g = gravityOffset();
      for (let i = 0; i < items.length; i += 1) {
        const disc = discs[i];
        if (!disc) continue;
        disc.style.transform = `translate(${g.x.toFixed(2)}px, ${g.y.toFixed(2)}px)`;
        items[i].style.zIndex = "";
        if (waveOpacity && !lensSuppressed()) {
          const meta = gridMeta[i] || { col: 0, row: 0, isNav: false };
          const wave = waveOpacity(meta.col, meta.row, meta.isNav);
          if (images[i] && items[i].classList.contains("dot-photo")) {
            images[i].style.opacity = wave.toFixed(3);
          }
          if (labels[i] && meta.isNav) {
            labels[i].style.opacity = Math.min(1, wave + 0.12).toFixed(3);
          }
        }
      }
    }

    function queueFrame() {
      if (!frameQueued) {
        frameQueued = true;
        window.requestAnimationFrame(applyLens);
      }
    }

    function shimmerAllowed() {
      return (
        isTouchMode() &&
        !reduceMotion &&
        !document.hidden &&
        !lensSuppressed()
      );
    }

    function shimmerFrame(now) {
      shimmerRaf = 0;
      if (!shimmerAllowed()) {
        if (isTouchMode()) {
          clearInlineReveal();
          applyTouchTransforms();
        }
        return;
      }
      if (!shimmerT0) shimmerT0 = now;
      const t = (now - shimmerT0) / 1000;
      applyTouchTransforms((col, row, isNav) => {
        const phase = t * 1.35 + col * 0.55 + row * 0.38;
        const wave = 0.5 + 0.5 * Math.sin(phase);
        if (isNav) {
          return 0.72 + wave * 0.22;
        }
        return 0.55 + wave * 0.45;
      });
      shimmerRaf = window.requestAnimationFrame(shimmerFrame);
    }

    function startShimmer() {
      if (reduceMotion || shimmerRaf) return;
      shimmerT0 = 0;
      shimmerRaf = window.requestAnimationFrame(shimmerFrame);
    }

    function stopShimmer() {
      if (shimmerRaf) {
        window.cancelAnimationFrame(shimmerRaf);
        shimmerRaf = 0;
      }
      shimmerT0 = 0;
      if (isTouchMode()) clearInlineReveal();
    }

    function openPageInfo() {
      if (!pageModal) return;
      pageModal.hidden = false;
      document.body.classList.add("modal-open");
      mouseX = null;
      mouseY = null;
      resetAll();
    }

    function closePageInfo() {
      if (!pageModal) return;
      pageModal.hidden = true;
      document.body.classList.remove("modal-open");
    }

    layoutColumns();
    window.requestAnimationFrame(measureCenters);

    const lensRoot = map.closest(".photo-stream-section") || map;

    if (!reduceMotion) {
      lensRoot.addEventListener("mousemove", (event) => {
        if (isTouchMode()) return;
        if (lensSuppressed()) {
          mouseX = null;
          mouseY = null;
          resetAll();
          return;
        }
        map.classList.remove("is-resting");
        mouseX = event.clientX + window.scrollX;
        mouseY = event.clientY + window.scrollY;
        queueFrame();
      });

      lensRoot.addEventListener("mouseleave", () => {
        if (isTouchMode()) return;
        mouseX = null;
        mouseY = null;
        resetAll();
      });

      document.addEventListener("social-lens:on", () => {
        mouseX = null;
        mouseY = null;
        resetAll();
      });

      document.addEventListener("filter-motion:on", () => {
        mouseX = null;
        mouseY = null;
        resetAll();
        stopShimmer();
      });

      document.addEventListener("filter-motion:off", () => {
        if (isTouchMode()) startShimmer();
      });

      document.addEventListener("home-intro:done", () => {
        layoutColumns();
        measureCenters();
        if (isTouchMode()) startShimmer();
      });
    }

    map.addEventListener("click", (event) => {
      const pageDot = event.target.closest(".dot-page");
      if (pageDot) {
        event.preventDefault();
        openPageInfo();
        return;
      }
      mouseX = null;
      mouseY = null;
      if (!isTouchMode()) resetAll();
    });

    if (pageModal) {
      pageModal.addEventListener("click", (event) => {
        if (event.target.closest("[data-close-page-info]")) {
          closePageInfo();
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !pageModal.hidden) {
          closePageInfo();
        }
      });
    }

    let resizeTimer = null;
    window.addEventListener("resize", () => {
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(() => {
        layoutColumns();
        measureCenters();
        if (isTouchMode()) {
          applyTouchTransforms();
          startShimmer();
        } else {
          resetAll();
        }
      }, 120);
    });

    window.addEventListener("journal-filter:changed", () => {
      refreshItems();
      layoutColumns();
      window.requestAnimationFrame(() => {
        measureCenters();
        if (isTouchMode()) {
          applyTouchTransforms();
          startShimmer();
        } else {
          resetAll();
        }
      });
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        stopShimmer();
      } else if (isTouchMode()) {
        startShimmer();
      }
    });

    if (motion) {
      motion.subscribe(() => {
        if (!isTouchMode()) return;
        if (!shimmerRaf) applyTouchTransforms();
      });
    }

    if (isTouchMode() && !reduceMotion) {
      if (!document.body.classList.contains("home-intro-active")) {
        startShimmer();
      }
    } else if (reduceMotion && isTouchMode()) {
      clearInlineReveal();
    }
  })();
</script>
