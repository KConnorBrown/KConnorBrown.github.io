<div class="photo-modal" id="photo-modal" hidden>
  <div class="photo-modal-backdrop" data-close-modal></div>
  <div class="photo-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="photo-modal-date">
    <button type="button" class="photo-modal-close" data-close-modal aria-label="Close">×</button>
    <img id="photo-modal-image" alt="">
    <div class="photo-modal-meta">
      <p class="meta" id="photo-modal-date"></p>
      <p id="photo-modal-caption"></p>
      <div class="photo-modal-tags" id="photo-modal-tags" hidden></div>
      {% if can_curate %}
        <div class="photo-modal-actions">
          <button type="button" class="button-secondary" id="photo-modal-unpublish">Hide from public</button>
          <button type="button" class="button-danger" id="photo-modal-delete">Delete permanently</button>
        </div>
      {% endif %}
    </div>
  </div>
</div>
