{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} | Connor Brown</title>
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
  </head>
  <body class="{% block body_class %}{% endblock %}" {% block body_attrs %}{% endblock %}>
    <main class="site-main">
      {% block content %}{% endblock %}
    </main>
    <div class="paint-spill" id="paint-spill" hidden aria-hidden="true"></div>
    {% include "pages/includes/social_dots.html" %}
    {% include "pages/includes/social_dots_js.html" %}
    {% include "pages/includes/page_transitions_js.html" %}
    {% block extra_js %}{% endblock %}
  </body>
</html>
