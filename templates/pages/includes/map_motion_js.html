<script>
  (() => {
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const touchQuery = window.matchMedia("(hover: none) and (pointer: coarse)");
    const listeners = new Set();
    const secureContext = window.isSecureContext;
    const hasOrientation = typeof window.DeviceOrientationEvent !== "undefined";
    const needsPermission =
      hasOrientation && typeof DeviceOrientationEvent.requestPermission === "function";
    const TILT_PREF_KEY = "map-tilt-enabled";

    const state = {
      reduceMotion,
      isTouch: touchQuery.matches,
      gravityX: 0,
      gravityY: 0,
      tiltEnabled: false,
      tiltAvailable: hasOrientation,
      // iPhone only grants orientation over HTTPS (tunnel / production), not LAN http://
      tiltNeedsHttps: Boolean(needsPermission && !secureContext),
    };

    let targetX = 0;
    let targetY = 0;
    let rafId = 0;
    let listening = false;
    let tiltBtn = null;

    function readTiltPref() {
      try {
        return window.localStorage.getItem(TILT_PREF_KEY) === "1";
      } catch (_err) {
        return false;
      }
    }

    function writeTiltPref(on) {
      try {
        if (on) window.localStorage.setItem(TILT_PREF_KEY, "1");
        else window.localStorage.removeItem(TILT_PREF_KEY);
      } catch (_err) {
        /* ignore quota / private mode */
      }
    }

    function syncTiltButton() {
      if (!tiltBtn) return;
      const show =
        state.isTouch &&
        !reduceMotion &&
        !state.tiltEnabled &&
        (state.tiltAvailable || state.tiltNeedsHttps);
      tiltBtn.hidden = !show;
      if (state.tiltNeedsHttps) {
        tiltBtn.textContent = "Tilt needs HTTPS";
        tiltBtn.title =
          "iPhone only allows tilt on a secure URL. Use production or the Cloudflare tunnel https:// link.";
      } else {
        tiltBtn.textContent = "Enable tilt";
        tiltBtn.title = "Allow device motion so the dots respond to phone tilt";
      }
    }

    function syncTouchClass() {
      state.isTouch = touchQuery.matches;
      document.body.classList.toggle("map-touch", state.isTouch);
      document.body.classList.toggle("map-reduced-motion", reduceMotion);
      syncTiltButton();
    }

    function notify() {
      listeners.forEach((fn) => {
        try {
          fn(state);
        } catch (_err) {
          /* ignore subscriber errors */
        }
      });
    }

    function tick() {
      rafId = 0;
      const ease = 0.12;
      state.gravityX += (targetX - state.gravityX) * ease;
      state.gravityY += (targetY - state.gravityY) * ease;
      if (
        Math.abs(targetX - state.gravityX) > 0.05 ||
        Math.abs(targetY - state.gravityY) > 0.05
      ) {
        rafId = window.requestAnimationFrame(tick);
      } else {
        state.gravityX = targetX;
        state.gravityY = targetY;
      }
      notify();
    }

    function queueTick() {
      if (!rafId) rafId = window.requestAnimationFrame(tick);
    }

    function onOrientation(event) {
      const beta = typeof event.beta === "number" ? event.beta : 0;
      const gamma = typeof event.gamma === "number" ? event.gamma : 0;
      const maxShift = 14;
      targetX = Math.max(-maxShift, Math.min(maxShift, gamma * 0.35));
      targetY = Math.max(-maxShift, Math.min(maxShift, (beta - 45) * 0.22));
      queueTick();
    }

    function startTilt() {
      if (listening || reduceMotion || !state.tiltAvailable) return;
      listening = true;
      state.tiltEnabled = true;
      window.addEventListener("deviceorientation", onOrientation, true);
      document.body.classList.add("map-tilt-on");
      syncTouchClass();
      notify();
    }

    async function requestOrientationAccess() {
      if (needsPermission) {
        const result = await DeviceOrientationEvent.requestPermission();
        return result === "granted";
      }
      return true;
    }

    async function enableTilt({ fromGesture = true } = {}) {
      if (reduceMotion) return false;
      if (state.tiltNeedsHttps) {
        if (tiltBtn) tiltBtn.textContent = "Open HTTPS tunnel";
        return false;
      }
      if (!state.tiltAvailable) return false;
      try {
        const allowed = await requestOrientationAccess();
        if (!allowed) return false;
        startTilt();
        writeTiltPref(true);
        return true;
      } catch (_err) {
        // Auto-resume without a gesture can throw on some iOS versions.
        if (!fromGesture) return false;
        return false;
      }
    }

    async function resumeTiltIfPreferred() {
      if (
        reduceMotion ||
        !state.isTouch ||
        !state.tiltAvailable ||
        state.tiltNeedsHttps ||
        !readTiltPref()
      ) {
        return false;
      }
      // After the user has granted once for this origin, iOS usually returns
      // "granted" again without a prompt — including on later page loads.
      return enableTilt({ fromGesture: false });
    }

    function ensureTiltButton() {
      if (tiltBtn || reduceMotion) return;
      tiltBtn = document.createElement("button");
      tiltBtn.type = "button";
      tiltBtn.id = "map-tilt-enable";
      tiltBtn.className = "map-tilt-enable";
      tiltBtn.textContent = "Enable tilt";
      tiltBtn.setAttribute("aria-label", "Enable tilt gravity for the map dots");
      tiltBtn.hidden = true;
      tiltBtn.addEventListener("click", () => {
        enableTilt({ fromGesture: true }).then((ok) => {
          if (!ok && tiltBtn && !state.tiltNeedsHttps) {
            tiltBtn.textContent = "Tilt unavailable";
          }
        });
      });
      document.body.appendChild(tiltBtn);
      syncTouchClass();
    }

    window.MapMotion = {
      get state() {
        return state;
      },
      subscribe(fn) {
        listeners.add(fn);
        fn(state);
        return () => listeners.delete(fn);
      },
      enableTilt,
      isTouch() {
        return state.isTouch;
      },
      gravity() {
        return { x: state.gravityX, y: state.gravityY };
      },
    };

    syncTouchClass();
    if (typeof touchQuery.addEventListener === "function") {
      touchQuery.addEventListener("change", syncTouchClass);
    } else if (typeof touchQuery.addListener === "function") {
      touchQuery.addListener(syncTouchClass);
    }

    if (!reduceMotion && (state.tiltAvailable || state.tiltNeedsHttps)) {
      ensureTiltButton();
      if (!needsPermission && state.isTouch && state.tiltAvailable && secureContext) {
        startTilt();
        writeTiltPref(true);
      } else {
        resumeTiltIfPreferred().then((ok) => {
          if (!ok) syncTouchClass();
        });
      }
    }
  })();
</script>
